[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cjd-flows"
version = "1.0.0.dev0"
description = "Stable uniformly scaling normalizing flows with constant Jacobian determinant and radial base distributions."
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENCE.md"]
authors = [
    { name = "Faried Abu Zaid", email = "fariedaz@gmail.com" },
]
keywords = ["normalizing-flows", "density-estimation", "verification", "pytorch", "onnx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The v1 core (cjd_flows.core, bijections, conditioners, radial, ...) only needs
# torch and numpy. Everything else is optional and imported lazily.
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Pre-v1 pyro-based API: cjd_flows.flows / transforms / distributions.
legacy = ["pyro-ppl>=1.9"]
onnx = ["onnx>=1.16", "onnxscript>=0.1", "onnxruntime>=1.17"]
eval = ["scipy>=1.11", "scikit-learn>=1.4", "matplotlib>=3.8"]
vision = ["torchvision>=0.17"]
# First preprocessing of the MAF tabular benchmarks (cjd_flows.data.tabular).
tabular = ["pandas>=2.2", "h5py>=3.10"]
docs = [
    "sphinx>=7",
    "furo",
    "myst-parser",
    "sphinx-copybutton",
    "sphinx-autodoc-typehints",
]

[project.urls]
Homepage = "https://github.com/USFlows/cjd-flows"
Repository = "https://github.com/USFlows/cjd-flows"
Documentation = "https://usflows.github.io/cjd-flows/"
Issues = "https://github.com/USFlows/cjd-flows/issues"
Changelog = "https://github.com/USFlows/cjd-flows/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist",
    "ruff",
    "hypothesis",
]

# ---------------------------------------------------------------------------
# Build: src layout, ship only the `cjd_flows` package. Benchmarks and docs are
# repository tooling.
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/cjd_flows"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/cjd_flows",
    "/tests",
    "/README.md",
    "/LICENCE.md",
    "/CITATION.cff",
    "/CITATION.bib",
    "/CHANGELOG.md",
]
exclude = ["__pycache__", "*.py[cod]"]

# ---------------------------------------------------------------------------
# uv
# ---------------------------------------------------------------------------
[tool.uv]
# Install the dev group by default with `uv sync`.
default-groups = ["dev"]

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "slow: long-running tests (deselect with '-m \"not slow\"')",
    "gpu: tests that require a CUDA/ROCm device (deselect with '-m \"not gpu\"')",
]

# ---------------------------------------------------------------------------
# Lint
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["docs/conf.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",   # line length is left to the formatter (long docstring/URL lines are fine)
    # Keep `typing.Optional/Union/Tuple/Sequence` annotations allowed (code base
    # style).
    "UP006", "UP007", "UP035", "UP045",
    "B905",   # zip(strict=...) is not required
]

[tool.ruff.lint.isort]
known-first-party = ["cjd_flows"]

[tool.ruff.lint.per-file-ignores]
# Legacy (pre-v1) code is kept as-is apart from targeted bug fixes. Only the
# pyflakes checks that indicate real bugs (undefined names, ...) stay active.
"src/cjd_flows/{flows,transforms,distributions,networks,sophia,linalg,utils}.py" = [
    "E", "I", "UP", "B", "F401", "F811", "F841", "F541",
]
"tests/cjd_flows/**" = ["E", "I", "UP", "B", "F401", "F811", "F841", "F541"]
